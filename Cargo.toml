[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/emirbugra/php-lsp-rs"
rust-version = "1.88"

[workspace.dependencies]
php-syntax = { path = "crates/php-syntax" }
php-format = { path = "crates/php-format" }
php-index = { path = "crates/php-index" }
php-composer = { path = "crates/php-composer" }
php-stubs = { path = "crates/php-stubs" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rayon = "=1.12.0"
ignore = "=0.4.34"
crossbeam-channel = "=0.5.17"
lsp-server = "=0.10.0"
lsp-types = "=0.97.0"
rustc-hash = "=2.1.3"
log = "=0.4.34"
env_logger = { version = "=0.11.11", default-features = false }
percent-encoding = "=2.3.2"
mimalloc = "=0.1.52"
libmimalloc-sys = { version = "=0.1.49", features = ["extended"] }
include_dir = "=0.7.4"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "unwind"
